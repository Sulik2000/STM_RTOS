solution:
  cdefault:
  compiler: GCC

  packs:
    - pack: ARM::CMSIS
    - pack: Keil::STM32F4xx_DFP@2.17.0

  target-types:
    - type: Nucleo-F411RE
      device: STM32F411RETx

  build-types:
    - type: Debug
      debug: on
      optimize: debug

    - type: Release
      debug: off
      optimize: balanced

  projects:
    - project: ./bootloader/bootloader.cproject.yml