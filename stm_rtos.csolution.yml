solution:
  cdefault:
  compiler: GCC

  packs:
    - pack: ARM::CMSIS
    - pack: Keil::STM32F4xx_DFP@2.17.0

  target-types:
    - type: Nucleo-F411RE
      device: STM32F411RETx
      target-set:
        - set:
          images:
            - project-context: rtos.Debug
            - project-context: bootloader.Debug

  build-types:
    - type: Debug
      debug: on
      optimize: debug

    - type: Release
      debug: off
      optimize: balanced

  projects:
    - project: ./bootloader/bootloader.cproject.yml
    - project: ./rtos/rtos.cproject.yml
  created-for: CMSIS-Toolbox@2.12.0
